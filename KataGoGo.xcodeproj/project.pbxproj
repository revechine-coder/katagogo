			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\nENGINE_SRC=\"${SRCROOT}/kata-engine\"\nENGINE_DST=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Resources/kata-engine\"\nENGINE_BINARY=\"katago-metal\"\nENGINE_CONFIG=\"gtp.cfg\"\nENGINE_MODEL=\"kata1-b18c384nbt.bin.gz\"\nLIBZIP_SRC=\"/opt/homebrew/opt/libzip/lib/libzip.5.dylib\"\nLIBLZMA_SRC=\"/opt/homebrew/opt/xz/lib/liblzma.5.dylib\"\nLIBZSTD_SRC=\"/opt/homebrew/opt/zstd/lib/libzstd.1.dylib\"\n\nfor file in \"${ENGINE_BINARY}\" \"${ENGINE_CONFIG}\" \"${ENGINE_MODEL}\"; do\n    if [ ! -f \"${ENGINE_SRC}/${file}\" ]; then\n        echo \"error: Missing bundled KataGo engine resource: ${ENGINE_SRC}/${file}\" >&2\n        exit 1\n    fi\ndone\n\nMODEL_PATH=\"${ENGINE_SRC}/${ENGINE_MODEL}\"\nif head -n 1 \"${MODEL_PATH}\" | grep -q \"^version https://git-lfs.github.com/spec/v1\"; then\n    echo \"error: ${MODEL_PATH} is a Git LFS pointer, not the real KataGo model. Run 'git lfs pull' before building.\" >&2\n    exit 1\nfi\nMODEL_SIZE=\"$(wc -c < \"${MODEL_PATH}\" | tr -d ' ')\"\nif [ \"${MODEL_SIZE}\" -lt 1000000 ]; then\n    echo \"error: ${MODEL_PATH} is too small to be a bundled KataGo model (${MODEL_SIZE} bytes). Run 'git lfs pull' before building.\" >&2\n    exit 1\nfi\n\nfor dylib in \"${LIBZIP_SRC}\" \"${LIBLZMA_SRC}\" \"${LIBZSTD_SRC}\"; do\n    if [ ! -f \"${dylib}\" ]; then\n        echo \"error: Missing KataGo dynamic library dependency: ${dylib}\" >&2\n        exit 1\n    fi\ndone\n\nWORK=\"$(mktemp -d)\"\ntrap \"rm -rf '${WORK}'\" EXIT\n\ncp \"${ENGINE_SRC}/${ENGINE_BINARY}\" \"${WORK}/${ENGINE_BINARY}\"\ncp -L \"${LIBZIP_SRC}\" \"${WORK}/libzip.5.dylib\"\ncp -L \"${LIBLZMA_SRC}\" \"${WORK}/liblzma.5.dylib\"\ncp -L \"${LIBZSTD_SRC}\" \"${WORK}/libzstd.1.dylib\"\n\nchmod u+w \"${WORK}/${ENGINE_BINARY}\" \"${WORK}/libzip.5.dylib\" \"${WORK}/liblzma.5.dylib\" \"${WORK}/libzstd.1.dylib\"\n\ninstall_name_tool -change \"${LIBZIP_SRC}\" \"@loader_path/libzip.5.dylib\" \"${WORK}/${ENGINE_BINARY}\"\ninstall_name_tool -id \"@loader_path/libzip.5.dylib\" \"${WORK}/libzip.5.dylib\"\ninstall_name_tool -change \"${LIBLZMA_SRC}\" \"@loader_path/liblzma.5.dylib\" \"${WORK}/libzip.5.dylib\"\ninstall_name_tool -change \"${LIBZSTD_SRC}\" \"@loader_path/libzstd.1.dylib\" \"${WORK}/libzip.5.dylib\"\ninstall_name_tool -id \"@loader_path/liblzma.5.dylib\" \"${WORK}/liblzma.5.dylib\"\ninstall_name_tool -id \"@loader_path/libzstd.1.dylib\" \"${WORK}/libzstd.1.dylib\"\n\ncodesign --force --sign - \"${WORK}/${ENGINE_BINARY}\" \"${WORK}/libzip.5.dylib\" \"${WORK}/liblzma.5.dylib\" \"${WORK}/libzstd.1.dylib\"\n\nmkdir -p \"${ENGINE_DST}\"\nrm -f \"${ENGINE_DST}/${ENGINE_BINARY}\" \"${ENGINE_DST}/${ENGINE_CONFIG}\" \"${ENGINE_DST}/${ENGINE_MODEL}\" \\\n      \"${ENGINE_DST}/libzip.5.dylib\" \"${ENGINE_DST}/liblzma.5.dylib\" \"${ENGINE_DST}/libzstd.1.dylib\"\n\nmv \"${WORK}/${ENGINE_BINARY}\" \"${ENGINE_DST}/\"\nmv \"${WORK}/libzip.5.dylib\" \"${ENGINE_DST}/\"\nmv \"${WORK}/liblzma.5.dylib\" \"${ENGINE_DST}/\"\nmv \"${WORK}/libzstd.1.dylib\" \"${ENGINE_DST}/\"\n\ncp \"${ENGINE_SRC}/${ENGINE_CONFIG}\" \"${ENGINE_DST}/\"\ncp \"${ENGINE_SRC}/${ENGINE_MODEL}\" \"${ENGINE_DST}/\"\n\nchmod 755 \"${ENGINE_DST}/${ENGINE_BINARY}\" \"${ENGINE_DST}/libzip.5.dylib\" \"${ENGINE_DST}/liblzma.5.dylib\" \"${ENGINE_DST}/libzstd.1.dylib\"\nchmod 644 \"${ENGINE_DST}/${ENGINE_CONFIG}\" \"${ENGINE_DST}/${ENGINE_MODEL}\"\n\necho \"Bundled KataGo Metal engine resources in ${ENGINE_DST}\"\n";
		};
