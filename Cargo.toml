[package]
name = "go_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "go_core"

[dependencies]
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "rt-multi-thread", "time", "macros"] }
regex = "1"
thiserror = "2"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
